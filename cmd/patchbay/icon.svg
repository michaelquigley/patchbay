<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- the patchbay mark: two blocks on the canvas, a cable between an output pin and an input pin. the hues are the
       application's own: the canvas dark, steel blue for audio, amber for midi. -->
  <defs>
    <clipPath id="a"><rect x="64" y="104" width="184" height="128" rx="20"/></clipPath>
    <clipPath id="b"><rect x="264" y="280" width="184" height="128" rx="20"/></clipPath>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#1f2226"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#3a3e44" stroke-width="8"/>
  <!-- the output block, audio -->
  <rect x="64" y="104" width="184" height="128" rx="20" fill="#2c3036"/>
  <rect x="64" y="104" width="184" height="44" fill="#3d85b8" clip-path="url(#a)"/>
  <rect x="64" y="104" width="184" height="128" rx="20" fill="none" stroke="#4a4f56" stroke-width="6"/>
  <!-- the input block, midi -->
  <rect x="264" y="280" width="184" height="128" rx="20" fill="#2c3036"/>
  <rect x="264" y="280" width="184" height="44" fill="#c7852e" clip-path="url(#b)"/>
  <rect x="264" y="280" width="184" height="128" rx="20" fill="none" stroke="#4a4f56" stroke-width="6"/>
  <!-- the cable, in the output's hue, slightly under the pins it joins -->
  <path d="M248,192 C352,192 160,360 264,360" fill="none" stroke="#3d85b8" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
  <!-- the pins -->
  <circle cx="248" cy="192" r="18" fill="#3d85b8" stroke="#1f2226" stroke-width="6"/>
  <circle cx="264" cy="360" r="18" fill="#c7852e" stroke="#1f2226" stroke-width="6"/>
</svg>
